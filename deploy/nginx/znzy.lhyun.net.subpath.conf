# 若服务器上 znzy.lhyun.net 根路径已有其他系统，可用此配置把智能作业挂到 /homework/
# 构建时需：VITE_BASE_PATH=/homework/ npm run build

location /homework/api/ {
    proxy_pass http://127.0.0.1:4000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 25m;
}

location /homework/uploads/ {
    proxy_pass http://127.0.0.1:4000/uploads/;
}

location /homework/embed/ {
    proxy_pass http://127.0.0.1:4000/embed/;
}

location /homework/ {
    alias /var/www/znzy-homework/dist/;
    try_files $uri $uri/ /homework/index.html;
}
