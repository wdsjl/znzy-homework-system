services:
  mysql:
    image: mysql:8.4
    container_name: znzy-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: znzy
      MYSQL_DATABASE: znzy_homework
      MYSQL_USER: znzy
      MYSQL_PASSWORD: znzy
    volumes:
      - znzy_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pznzy"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    container_name: znzy-app
    restart: unless-stopped
    ports:
      - "4000:4000"
      - "4173:4173"
    environment:
      API_PORT: 4000
      ASYNC_GRADING: "1"
      DATABASE_URL: mysql://znzy:znzy@mysql:3306/znzy_homework
      USE_FORMAL_SCHEMA: ${USE_FORMAL_SCHEMA:-0}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - znzy_uploads:/app/server/uploads
      - znzy_app_data:/app/server/data

volumes:
  znzy_mysql_data:
  znzy_uploads:
  znzy_app_data:
